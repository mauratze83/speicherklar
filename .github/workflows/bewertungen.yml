# Holt die freigegebenen Kundenbewertungen vom Worker speicherklar-pro, schreibt src/bewertungen.json,
# baut /pro/ neu und veröffentlicht. Startet der Worker nach jeder Freigabe auf speicherklar.de/freigabe/
# (Secret GH_DISPATCH_TOKEN im Worker), oder von Hand.
name: Bewertungen
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: bewertungen
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Freigegebene Bewertungen holen
        run: |
          curl -sf -X POST -H "Origin: https://speicherklar.de" -H "Content-Type: application/json" -d '{}' \
            https://speicherklar-pro.speicherklar.workers.dev/reviews -o /tmp/reviews.json
          python3 scripts/bewertungen.py /tmp/reviews.json
      - name: Seite bauen
        run: python3 build.py
      - name: Veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then echo "Keine Änderung."; exit 0; fi
          git config user.name "speicherklar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/bewertungen.json pro/index.html sitemap.xml src/sitemap-dates.json worker-klara/wissen.js llms.txt
          git commit -m "Bewertungen aktualisiert"
          git push
          # Pushes mit dem Workflow-Token lösen den Pages-Build nicht immer aus, deshalb ausdrücklich anstoßen
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages-Build ließ sich nicht anstoßen, läuft ggf. von selbst."
