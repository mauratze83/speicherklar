# Cloudflare Worker für Kauf und Freischaltung von Speicherklar Pro.
# Deploy über GitHub Actions (.github/workflows/worker.yml). Geheimnisse liegen nur in GitHub/Cloudflare, nie im Repo.
name = "speicherklar-pro"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
SITE = "https://speicherklar.de"
ALLOWED_ORIGINS = "https://speicherklar.de,http://localhost:8765"
PRICE_INTRO = "price_1UZwBGJZ79g2fqSOZMl6bGTf"     # Stripe-Preis-ID 49 €
PRICE_REGULAR = "price_1UZyJwJZ79g2fqSOzRXwODYX"   # Stripe-Preis-ID 89 €
INTRO_UNTIL = ""      # letzter Tag des Einführungspreises, z. B. "2027-02-28"
STRIPE_VERSION = ""   # nur setzen, falls Managed Payments eine bestimmte API-Version verlangt
