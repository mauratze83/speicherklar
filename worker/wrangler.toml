# Cloudflare Worker für Kauf und Freischaltung von Speicherklar Pro.
# Deploy über GitHub Actions (.github/workflows/worker.yml). Geheimnisse liegen nur in GitHub/Cloudflare, nie im Repo.
name = "speicherklar-pro"
main = "index.js"
compatibility_date = "2026-10-01"

[vars]
SITE = "https://speicherklar.de"
ALLOWED_ORIGINS = "https://speicherklar.de,http://localhost:8765"
PRICE_INTRO = "price_1UaIovJ9nFUROYPZrv2NUxKG"     # Stripe-Preis-ID 49 €
PRICE_REGULAR = "price_1UaIovJ9nFUROYPZJINboaxY"   # Stripe-Preis-ID 89 €
INTRO_UNTIL = "2027-01-31"   # letzter Tag des Einführungspreises (wie introUntil in src/pro-config.js)
STRIPE_VERSION = ""   # nur setzen, falls Managed Payments eine bestimmte API-Version verlangt
MAX_DEVICES = "3"     # so viele Browser/Geräte darf ein Schlüssel freischalten
FREE_KEYS = "0681a7e8704ae25cac3dee2b4cdd38c17197e37bbe0169138447ea1dc61ef930"  # SHA-256 von Freischlüsseln (ohne Kauf, ohne Gerätelimit), kommagetrennt; Hash löschen = Schlüssel gesperrt
ML_GROUP_BUYERS = "203693629868345239"  # MailerLite-Gruppe "Käufer Pro" (Mail mit Schlüssel nach dem Kauf)
ML_GROUP_RESEND = "203693641177237009"  # MailerLite-Gruppe "Pro Schlüssel erneut" (Mail bei "Schlüssel vergessen?")

# Speicher für Geräte je Schlüssel und Sperren. Die ID trägt der Workflow beim Veröffentlichen ein.
[[kv_namespaces]]
binding = "LICENSES"
id = "KV_ID_PLATZHALTER"
